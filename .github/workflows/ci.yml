name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Install only necessary packages (skip CLI to avoid better-sqlite3 native build issues)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: true
          npm_config_build_from_source: false

      - name: Build shared and core packages
        run: pnpm --filter @crosssync/shared --filter @crosssync/core build

      - name: Type check (shared & core)
        run: pnpm --filter @crosssync/shared --filter @crosssync/core typecheck

      - name: Run tests (shared & core)
        run: pnpm --filter @crosssync/shared --filter @crosssync/core test

      - name: Build Electron app
        run: |
          cd electron-app
          pnpm build
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: true

      - name: Package Electron app (Linux)
        run: |
          cd electron-app
          pnpm exec electron-builder --linux --x64 --dir
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: true

      - name: Lint Electron app
        run: pnpm --filter crosssync-desktop lint

      - name: Verify Electron package config
        run: |
          cd electron-app
          pnpm exec electron-builder --validate-config
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: true

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-linux
          path: electron-app/release/
          retention-days: 7

      - name: Verify build
        run: |
          echo "✅ Build verification"
          ls -lh electron-app/out/main/index.js
          ls -lh electron-app/out/renderer/index.html
          ls -lh electron-app/release/
