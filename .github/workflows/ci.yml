name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Install dependencies (skip better-sqlite3 compilation)
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: true
          npm_config_build_from_source: false

      # Build shared and core (TypeScript only, no native deps needed)
      - name: Build shared and core packages
        run: |
          cd packages/shared && pnpm build
          cd ../core && pnpm build
        working-directory: ${{ github.workspace }}

      - name: Type check (shared & core)
        run: |
          cd packages/shared && pnpm typecheck
          cd ../core && pnpm typecheck
        working-directory: ${{ github.workspace }}

      - name: Run tests (shared & core)
        run: |
          cd packages/shared && pnpm test
          cd ../core && pnpm test
        working-directory: ${{ github.workspace }}

      # Build Electron app
      - name: Build Electron app
        run: |
          cd electron-app
          pnpm build
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: true

      # Lint Electron app
      - name: Lint Electron app
        run: pnpm --filter crosssync-desktop lint

      # Verify build output exists
      - name: Verify build
        run: |
          echo "✅ Build verification"
          ls -lh electron-app/out/main/index.js
          ls -lh electron-app/out/renderer/index.html
          test -f electron-app/out/main/index.js || (echo "❌ Main process build failed" && exit 1)
          test -f electron-app/out/renderer/index.html || (echo "❌ Renderer build failed" && exit 1)
