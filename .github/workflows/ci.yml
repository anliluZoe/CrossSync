name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version comes from the `packageManager` field in package.json.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      # Smoke test the built CLI without touching any real browser data.
      - name: CLI smoke test
        run: |
          node packages/cli/dist/index.js --version
          node packages/cli/dist/index.js --home-dir "$RUNNER_TEMP/crosssync-ci" config --path
          node packages/cli/dist/index.js --home-dir "$RUNNER_TEMP/crosssync-ci" install-cron --dry-run
          node packages/cli/dist/index.js --home-dir "$RUNNER_TEMP/crosssync-ci" status --json
