name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Install dependencies (use minimal workspace to skip CLI/better-sqlite3)
      - name: Create minimal workspace config
        run: |
          # Save original workspace file
          mv pnpm-workspace.yaml pnpm-workspace.yaml.bak

          # Create minimal workspace without CLI
          cat > pnpm-workspace.yaml << 'EOF'
          packages:
            - 'packages/shared'
            - 'packages/core'
          EOF

          cat pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          npm_config_build_from_source: false

      - name: Build shared and core packages
        run: |
          pnpm --filter @crosssync/shared build
          pnpm --filter @crosssync/core build

      - name: Type check (shared & core)
        run: |
          pnpm --filter @crosssync/shared typecheck
          pnpm --filter @crosssync/core typecheck

      - name: Run tests (shared & core)
        run: |
          pnpm --filter @crosssync/shared test
          pnpm --filter @crosssync/core test

      # Restore original workspace config
      - name: Restore workspace config
        if: always()
        run: |
          test -f pnpm-workspace.yaml.bak && mv pnpm-workspace.yaml.bak pnpm-workspace.yaml
