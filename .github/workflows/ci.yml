name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version comes from the `packageManager` field in package.json.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build packages
        run: pnpm build

      - name: Lint
        run: pnpm lint

      # Build Electron app (but don't package yet)
      - name: Build Electron app
        run: |
          cd electron-app
          pnpm build
          pnpm exec electron-builder --dir
        env:
          # Skip Electron binary download during build
          ELECTRON_SKIP_BINARY_DOWNLOAD: true

      - name: Verify Electron package config
        run: |
          cd electron-app
          pnpm exec electron-builder --validate-config
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: true

      # Smoke test the built CLI without touching any real browser data.
      - name: CLI smoke test
        run: |
          node packages/cli/dist/index.js --version
          node packages/cli/dist/index.js --home-dir "$RUNNER_TEMP/crosssync-ci" config --path
          node packages/cli/dist/index.js --home-dir "$RUNNER_TEMP/crosssync-ci" install-cron --dry-run
          node packages/cli/dist/index.js --home-dir "$RUNNER_TEMP/crosssync-ci" status --json

      - name: Verify Electron app build
        run: |
          echo "✅ Electron app built successfully"
          ls -lh electron-app/out/main/index.js
          ls -lh electron-app/out/renderer/index.html
