name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # Install only necessary packages (exclude CLI to skip better-sqlite3)
      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: true

      # Build shared and core packages
      - name: Build shared and core packages
        run: |
          pnpm --filter @crosssync/shared build
          pnpm --filter @crosssync/core build

      - name: Type check (shared & core)
        run: |
          pnpm --filter @crosssync/shared typecheck
          pnpm --filter @crosssync/core typecheck

      - name: Run tests (shared & core)
        run: |
          pnpm --filter @crosssync/shared test
          pnpm --filter @crosssync/core test

      # Build Electron app
      - name: Build Electron app
        run: |
          cd electron-app
          pnpm build
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: true

      # Lint Electron app
      - name: Lint Electron app
        run: pnpm --filter crosssync-desktop lint

      # Verify build output exists
      - name: Verify build
        run: |
          echo "✅ Build verification"
          ls -lh electron-app/out/main/index.js
          ls -lh electron-app/out/renderer/index.html
          test -f electron-app/out/main/index.js || (echo "❌ Main process build failed" && exit 1)
          test -f electron-app/out/renderer/index.html || (echo "❌ Renderer build failed" && exit 1)
