name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump applied before publishing (auto = bump unless package.json is already ahead)
        type: choice
        options:
          - auto
          - patch
          - minor
          - major
        default: auto
      dry_run:
        description: Run npm publish --dry-run without uploading
        type: boolean
        default: false
      commit_version:
        description: Commit the bumped version back to the branch after publishing
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        # Version comes from the `packageManager` field in package.json.

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Determine next version
        id: version
        run: |
          NAME=$(node -p "require('./packages/cli/package.json').name")
          LOCAL=$(node -p "require('./packages/cli/package.json').version")
          PUBLISHED=$(npm view "$NAME" version 2>/dev/null || true)
          BUMP="${{ inputs.bump }}"

          NEXT=$(node .github/scripts/next-version.mjs ./packages/cli/package.json "$PUBLISHED" "$BUMP" --write)

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "previous=$LOCAL" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          echo "$NAME: $LOCAL -> $NEXT (published: ${PUBLISHED:-none}, bump: $BUMP)"

          if npm view "$NAME@$NEXT" version >/dev/null 2>&1; then
            echo "::error::$NAME@$NEXT is already published. Choose a larger bump type."
            exit 1
          fi

      - name: Verify packages
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test
          pnpm build

      - name: Require NPM_TOKEN
        if: ${{ !inputs.dry_run }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Add an npm token as the NPM_TOKEN repository secret."
            exit 1
          fi

      - name: Publish (dry run)
        if: ${{ inputs.dry_run }}
        run: npm publish ./packages/cli --access public --dry-run
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish ./packages/cli --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Commit version bump
        if: ${{ !inputs.dry_run && inputs.commit_version && github.ref_type == 'branch' }}
        run: |
          if git diff --quiet -- packages/cli/package.json; then
            echo "Version unchanged, nothing to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/cli/package.json
          git commit -m "chore(release): ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }}"

          if ! git push origin "HEAD:$GITHUB_REF_NAME"; then
            echo "::warning::Published ${{ steps.version.outputs.name }}@${{ steps.version.outputs.version }} but failed to push the version bump. Commit packages/cli/package.json manually."
          fi

      - name: Write summary
        run: |
          {
            echo "### npm publish"
            echo ""
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Package | \`${{ steps.version.outputs.name }}\` |"
            echo "| Version | \`${{ steps.version.outputs.previous }}\` -> \`${{ steps.version.outputs.version }}\` |"
            echo "| Bump | \`${{ inputs.bump }}\` |"
            echo "| Dry run | \`${{ inputs.dry_run }}\` |"
            echo "| Committed | \`${{ !inputs.dry_run && inputs.commit_version && github.ref_type == 'branch' }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
