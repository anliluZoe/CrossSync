name: Build Electron App

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-electron:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: true
          npm_config_build_from_source: false

      - name: Build Electron app and workspace packages
        run: pnpm --filter crosssync-desktop... build
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: true

      - name: Package Electron app (Linux)
        run: |
          cd electron-app
          pnpm exec electron-builder --linux --x64 --dir
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: true

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-linux
          path: electron-app/release/
          retention-days: 7

      - name: Comment PR with build info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');
            const assetsDir = 'electron-app/out/renderer/assets';
            const bundle = fs.existsSync(assetsDir)
              ? fs.readdirSync(assetsDir).find((file) => file.endsWith('.js'))
              : null;

            if (bundle) {
              const stats = fs.statSync(path.join(assetsDir, bundle));
              const sizeKB = (stats.size / 1024).toFixed(2);

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## ✅ Electron App Build

                **Status**: Build successful
                **Renderer bundle size**: ${sizeKB} KB

                Build artifacts will be available as a workflow artifact.`
              });
            }
