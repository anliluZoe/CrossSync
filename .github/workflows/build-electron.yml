name: Build Electron App (PR & Push)

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-electron:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm build

      - name: Build Electron app (production)
        run: |
          cd electron-app
          pnpm build
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: true

      - name: Package Electron app (Linux)
        run: |
          cd electron-app
          pnpm exec electron-builder --linux --x64 --dir
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: true
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Electron artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-app-linux
          path: electron-app/release/
          retention-days: 7

      - name: Comment PR with build info
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'electron-app/out/renderer/assets/index-CHXwWPdQ.js';

            if (fs.existsSync(path)) {
              const stats = fs.statSync(path);
              const sizeKB = (stats.size / 1024).toFixed(2);

              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## ✅ Electron App Build

                **Status**: Build successful
                **Renderer bundle size**: ${sizeKB} KB

                Build artifacts will be available as a workflow artifact.`
              });
            }
