app-id: com.crosssync.desktop
product-name: CrossSync Desktop
copyright: Copyright © 2024 CrossSync Team

directories:
  buildResources: build
  output: release/${os}-${arch}

files:
  - dist-electron/**/*
  - dist/**/*
  - package.json
  - node_modules/**/*

mac:
  category: public.app-category.productivity
  target:
    - target: dmg
    - target: zip
  icon: build/icon.icns

win:
  target:
    - target: nsis
    - target: portable
  icon: build/icon.ico

linux:
  target:
    - target: AppImage
    - target: deb
  icon: build/icon.png
  category: Utility

nsis:
  one-click: false
  allowToChangeInstallationDirectory: true

compression: maximum
